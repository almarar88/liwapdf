name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (created if it does not exist)'
        required: true
        default: 'v1.2.1'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            command: npm run dist:win
          - os: macos-latest
            label: macOS
            command: npm run dist:mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: ${{ matrix.command }}
        env:
          # Unsigned builds: skip signing and notarization entirely.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alcode-editor-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' \) \
            -exec cp {} upload/ \;
          ls -la upload

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Alcode Editor ${{ inputs.tag || github.ref_name }}
          files: upload/*
          draft: false
          generate_release_notes: true
          body: |
            ## Alcode Editor ${{ inputs.tag || github.ref_name }}

            **تحميل مباشر / Direct download**

            | النظام | الملف |
            | --- | --- |
            | Windows 10/11 (مثبّت) | `Alcode-Editor-1.6.0-x64-Setup.exe` |
            | Windows (محمول) | `Alcode-Editor-1.6.0-Portable.exe` |
            | macOS Apple Silicon | `Alcode-Editor-1.6.0-arm64.dmg` |
            | macOS Intel | `Alcode-Editor-1.6.0-x64.dmg` |

            ### الجديد في هذا الإصدار

            **ضغط ملفات Office كان يُفسدها**

            - عند تصغير ملف Word أو Excel، كانت الصور تُعاد كتابتها بصيغة
              مختلفة **تحت الاسم القديم نفسه** — وصيغة أي جزء داخل ملف Office
              معلَنة بامتداده. النتيجة: صور مكسورة، أو Word يعرض «إصلاح الملف».
              صار كل جزء يُعاد ترميزه بصيغته المعلَنة فقط.
            - **الصور الشفافة** كانت تُسطَّح على خلفية بيضاء، فيعود الشعار
              ومعه مستطيل أبيض. صارت الشفافية تُكتشف وتُحفظ.
            - خيار «حوّل PNG إلى JPEG عند الفائدة» لم يكن يُقرأ من أي مكان —
              صار يعمل فعلًا.

            **معالجة دفعية — أداة جديدة**

            - طبّق عملية واحدة على عشرات الملفات دفعة واحدة: **ضغط**، أو
              **تحويل إلى PDF**، أو **علامة مائية**، أو **حماية بكلمة مرور** —
              وتُحفظ كلها في مجلد تختاره.
            - تُقرأ الملفات **واحدًا واحدًا** ويُفرَّغ كل واحد قبل التالي، فمجلد
              فيه مئتا مسح ضوئي لا يستنزف الذاكرة.
            - فشل ملف واحد لا يوقف البقية: تُكمل المعالجة ويقول التقرير في
              النهاية «تمّ ٤٧ من ٥٠» ويسمّي ما تعذّر.
            - يمكن الإيقاف في أي لحظة، وما اكتمل يبقى محفوظًا.

            **صندوق الأدوات كان يقول «افتح مستنداً أولاً» والمستند مفتوح**

            - التطبيق يحتفظ بخانتين للمستندات: واحدة للـPDF تستخدمها الأدوات،
              وأخرى لكل الصيغ الأخرى يعيش فيها المحرر — ولم تكن الخانتان
              تتحدثان. فمع ملف Word مفتوح أمامك ترفض كل أداة العمل برسالة
              تراها بعينك أنها غير صحيحة.
            - صار في أعلى صندوق الأدوات **شريط مساحة عمل** يقول أي مستند
              ستعمل عليه الأدوات، وينقلك بينها بنقرة، ويعرض **«حوّل إلى PDF
              وتابع»** بدل الطريق المسدود.

            **الصور والشعارات في المستندات**

            - تصدير RTF و ODT كان **يحذف كل الصور بصمت** — شعار أو رسم بياني
              يختفي دون كلمة. صارت الصور تُكتب فعليًا: صيغة `\\pict` في RTF،
              وملفات صور داخل حزمة ODT مع مرجع في المحتوى.
            - **عروض PowerPoint** صارت تُستخرج صورها أيضًا، وكانت تُقرأ نصًّا
              فقط — والعرض صوره نصف رسالته.
            - تحقّقت بدورة كاملة: صدّر مستندًا فيه صورة إلى كل صيغة، ثم أعد
              قراءته وتأكد أن الصورة عادت. ٥/٥ ناجحة.

            **صفحة رئيسية جديدة — لوحة معلومات**

            - كانت تعرض أرقامًا دعائية عن البرنامج. صارت تعرض **عملك أنت**:
              المستندات المفتوحة الآن بنقرة للانتقال إليها، عدد صفحات الـPDF
              وكلمات المحرر، الملفات الأخيرة، توقيعاتك المحفوظة، وعرض استعادة
              العمل غير المحفوظ إن وُجد.

            **توقيعك — ارسمه مرة واستخدمه دائمًا**

            - لوح توقيع في محرر المستندات وفي تحرير الـPDF: ارسم توقيعك،
              سمِّه، واحفظه في مكتبة تبقى معك. بعدها تختاره بنقرة على أي مستند.
            - **استيراد من صورة:** صوِّر توقيعك على ورقة بيضاء، والتطبيق يرفع
              الحبر ويجعل الخلفية شفافة — فلا يأتي معه مستطيل أبيض يغطي النص.
            - يُقصّ التوقيع تلقائيًا إلى حدود الحبر، فيستقر حيث تضعه بالضبط
              بدل أن يحمل معه فراغ لوح الرسم كله.

            **مميزات لكُتّاب الكتب**

            - **تصدير إلى EPUB.** كان التطبيق يقرأ الكتب ولا يكتبها — وهو
              العكس تمامًا لما يحتاجه المؤلف. الآن يُقسَّم المخطوط إلى فصول
              عند كل عنوان رئيسي، ويُبنى له فهرس تنقّل واتجاه صفحات من اليمين،
              فيفتح في كل قارئ إلكتروني ككتاب حقيقي لا كصفحة طويلة.
            - **فهرس المحتويات** يُبنى من عناوين المستند بنقرة — لا يُكتب
              يدويًا ليتقادم مع أول إعادة تسمية لفصل.
            - **هدف الكتابة:** اكتب عدد الكلمات المستهدف، ويظهر شريط تقدّم
              مباشر في شريط الإحصاءات. مخفي حتى تطلبه.
            - **وضع التركيز:** تخفت الأدوات ويبقى النص وحده أمامك. Esc للخروج.

            **حفظ تلقائي واستعادة بعد الانهيار**

            - ما تكتبه في المحرر يُحفظ تلقائيًا نسخةً جانبية كل بضع ثوانٍ.
              فإن أُغلق التطبيق أو انقطعت الكهرباء قبل الحفظ، تجد عند فتحه
              عرضًا باستعادة آخر نسخة — بدل أن يضيع العمل الذي لم يُحفظ بعد،
              وهو تحديدًا العمل الذي يهمّ. تُمسح النسخة فور الحفظ أو الإغلاق.

            **بحث داخل المستند (Ctrl+F)**

            - شريط بحث بعدّاد مباشر وتنقّل بين النتائج. التظليل يُرسم عبر
              واجهة التظليل في المتصفح لا بإدراج عناصر في المستند، فالبحث لا
              يترك أثرًا فيما يبحث فيه ولا يظهر في الملف المُصدَّر.
              البحث يتجاهل التشكيل واختلاف الألف والهمزة.

            **إدراج التاريخ — هجري وميلادي**

            - قائمة في شريط الأدوات تُدرج التاريخ ميلاديًا أو هجريًا أو
              بالصيغة المزدوجة «١٩ ربيع الأول ١٤٤٨ هـ الموافق 1 سبتمبر 2026».

            **قائمة الزر الأيمن**

            - Electron لا يوفّر قائمة سياق أصلًا، فكانت خطوط التدقيق الإملائي
              الحمراء زينةً لا سبيل للوصول إلى اقتراحاتها. صار الزر الأيمن
              يعرض الاقتراحات وإضافة الكلمة للقاموس، مع قص ونسخ ولصق وتراجع
              و**لصق بدون تنسيق** — وهو ما يمنع تنسيق Word من التسلّل معه.

            **نسخ ولصق نطاق في الجداول**

            - انسخ مستطيلًا من الخلايا أو الصقه من Excel مباشرة. اللصق يكتب
              الكتلة كاملة دفعة واحدة بدل خلية خلية.

            **أزرار الجداول لم تكن تظهر أبدًا**

            - أزرار «إضافة صف» و«إضافة عمود» و«حذف الصف» و«حذف العمود» كانت
              مشروطة بفحص لموضع مؤشر الكتابة يُجرى أثناء الرسم — وتحريك المؤشر
              لا يُعيد الرسم، فلم تظهر الأزرار ولو مرة، وتحرير الجداول كان
              غير ممكن من شريط الأدوات أصلًا. صارت تتابع المؤشر فعليًا.

            **«بحث واستبدال» كان يقول «تم» ولا يغيّر شيئًا**

            - يظهر لك «تم استبدال ١ تطابق» والمستند كما هو حرفيًا. سطح التحرير
              كان يُعيد رسم محتواه عند تغيّر هوية المستند فقط — وهي لا تتغيّر
              أثناء العمل على نفس الملف — فالتعديل يصل إلى الذاكرة ولا يصل إلى
              الشاشة أبدًا، ثم تمسحه أول ضغطة زر بعده.
            - صار السطح يُعيد التحميل عند أي تعديل لم تكتبه بنفسك، دون أن يفعل
              ذلك على ما تكتبه (وهو ما كان سيُفقد مؤشر الكتابة عند كل حرف).
            - جُرِّب على التطبيق المبني نفسه: كتابة، ثم استبدال، والتحقق من أن
              الكلمة تغيّرت فعلاً على الصفحة — لا من التقرير الذي يظهر.

            **الحروف العربية المنفصلة في المحرر**

            - ملفات Word — وكل ما يُحوَّل من PDF إلى Word — تحمل غالبًا **أشكال
              الحروف المرسومة** بدل الحروف نفسها: رمز مستقل لكل شكل. لا يستطيع
              أي مُشكِّل وصلها، فيظهر النص وكل حرف فيه منفصل عن جاره، ويفشل
              البحث والنسخ عليه أيضًا.
            - كان التطبيق يعالج هذا في ملفات ‎.txt‎ و‎.md‎ **فقط**. صار يعالجه في
              كل الصيغ: Word و RTF و ODT و EPUB و PowerPoint و HTML وجداول
              البيانات — في مكان واحد لا يمكن نسيانه مع أي صيغة تُضاف لاحقًا.
            - والمعالجة صارت لكل حرف على حدة، فلم تعد تمسّ الطباعة اللاتينية في
              المستند (روابط الحروف والكسور كانت تُعاد كتابتها بلا سبب).

            **خط عربي مناسب للمستندات**

            - سطح التحرير صار يفضّل خطوط النسخ المعتادة في الخطابات والتقارير
              (Sakkal Majalla ثم Segoe UI ثم Traditional وSimplified Arabic)،
              وأُضيفت كلها إلى قائمة الخطوط في شريط الأدوات. خط Amiri بقي في
              آخر القائمة لأنه خط نسخ فني لا يناسب متن المستندات.

            **الكتابة العربية داخل نماذج PDF**

            - تعبئة حقل في نموذج بنص عربي كانت **لا تفعل شيئًا**: خط الحقل
              الافتراضي في أي نموذج حكومي هو Helvetica، وترميزه لا يمثّل أي حرف
              عربي، فيُبتلع الخطأ ويقول التطبيق «تم» على نموذج لم يُملأ. صار
              يُضمَّن خط عربي عند الحاجة، والقيم العربية تُحاذى لليمين.
            - «مكتب Alcode بأبوظبي» كانت تُطبع «مكتب edoclA بأبوظبي» — الكلمة
              اللاتينية داخل الجملة العربية تنعكس. صارت صحيحة.

            **التعليقات والنصوص تنزل في مكانها الصحيح**

            - أي نص أو شكل تضيفه على صفحة **صندوق حدودها لا يبدأ من الصفر** —
              وهذا شائع في الملفات الممسوحة ضوئيًا والصادرة عن Word — كان ينزل
              مُزاحًا عن الموضع الذي رسمته. صار يستقر في مكانه بالضبط.
            - وعلى الصفحات **المُدارة** (90 و180 و270 درجة) كان ينزل مقلوبًا أو
              خارج الورقة. أُعيد اشتقاق التحويل من صفحات مرسومة فعليًا لا من
              حساب نظري، وصُحِّحت الزوايا الثلاث كلها — ويستفيد منها أيضًا
              العلامة المائية وترقيم الصفحات والترويسة.
            - النص العربي يبدأ من الحافة اليمنى للمربع الذي ترسمه، لا من اليسرى.

            **الأرقام العربية لم تعد تُقلب**

            - رقم مثل ١٢٣٤٥ كان يُكتب في ملف PDF معكوسًا (٥٤٣٢١) لأن مُشكّل الخطوط
              يعتبر الأرقام العربية‑الهندية نصًّا يُقرأ من اليمين. صار الرقم يظهر
              صحيحًا على الصفحة وعند نسخه أو البحث عنه — يمسّ أرقام الصفحات
              والتواريخ والمبالغ وطبقة الـOCR.

            **تنقيح بالبحث**

            - أداة جديدة تبحث عن نص أو نمط في كل الصفحات وتحذفه نهائيًا دفعة واحدة،
              مع أنماط جاهزة (بريد، هاتف، آيبان، هوية وطنية، بطاقة، تاريخ) وقائمة
              مراجعة تعرض كل تطابق بسياقه قبل الحذف.
            - التطبيق لم يعد يدّعي تحققًا لم يحدث: النتيجة تُفحَص فعليًا بعد الحفظ،
              ويمكن حفظ تقرير بما حُذف — لأن التنقيح لا رجعة فيه.

            **طباعة حقيقية**

            - زر الطباعة كان يفتح الملف في التطبيق نفسه بدل طباعته. صار يرسل الصفحات
              المطلوبة إلى نافذة الطباعة مع اختيار الطابعة والنطاق وعدد النسخ.

            **تصحيحات عربية أخرى**

            - استخراج النص يحترم اتجاه السطر، فلا تنقلب الجملة العربية.
            - «البحث عن كلمة كاملة» صار يعمل مع العربية (كان لا يطابق شيئًا).
            - الأرقام العربية‑الهندية داخل خلايا الجداول تُقرأ كأرقام.

            **من الإصدار السابق — إصلاحات تمسّ سلامة الملفات**

            - **ملف PDF محمي بكلمة مرور** كان تحريره يُنتج ملفًا لا يُفتح مرة أخرى؛ صار
              التشفير يُنظَّف فعليًا، ويُنبَّه المستخدم قبل الحفظ فوق أصل محمي.
            - **إعادة الترتيب والحذف والاستخراج والتكرار و«تحسين وإصلاح»** لم تعد تمحو
              الفهارس والنماذج والمرفقات وتسميات الصفحات.
            - **الملفات النصية** تُحفظ بترميزها الأصلي (Windows‑1256 يبقى كما هو)
              وبأسطرها كاملة — كان الحفظ يدمجها في سطر واحد.
            - **صفحات HTML** لم تعد تُحفظ فوق أصلها بقشرة ناقصة.
            - أخطاء الكتابة (نفاد المساحة، صلاحيات، قرص مفصول) تظهر برسالة واضحة بدل
              أن تمرّ بصمت، والدفعات تعزل كل ملف وتقول ما نجح وما فشل.

            **مميزات أساسية**

            - **التعرّف الضوئي على النص (OCR) — عربي وإنجليزي، بدون إنترنت.**
            - **تنقيح حقيقي** يحذف المحتوى ويتحقّق من اختفائه.
            - **تحديد النص ونسخه من صفحات PDF**، وبحث يُبرز التطابق في مكانه.
            - **نص عربي متجهي في PDF** قابل للبحث والتحديد.
            - **صفر اتصالات شبكية — مُتحقَّق منه**.
            - عارض مُحوسَب وبدء أسرع، وتشغيل كامل بلوحة المفاتيح.

            > النسخ غير موقّعة رقمياً. على ويندوز اختر **More info → Run anyway**،
            > وعلى macOS افتح التطبيق بزر الفأرة الأيمن ثم **Open**.
