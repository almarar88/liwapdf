name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (created if it does not exist)'
        required: true
        default: 'v1.2.1'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            command: npm run dist:win
          - os: macos-latest
            label: macOS
            command: npm run dist:mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: ${{ matrix.command }}
        env:
          # Signing is used the moment the secrets exist and skipped until
          # then: CSC_LINK is a base64 .p12 (Windows or Apple Developer ID),
          # the Apple trio enables notarization.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alcode-editor-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

  # The download page (github.io) mirrors the installers under names that do
  # not change between releases, so the README links never go stale. It is a
  # branch-served Pages site; the branch is rewritten as one commit each time,
  # otherwise every release would add another 400 MB to the repository.
  pages:
    name: Publish download page
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Stage installers under stable names
        run: |
          set -e
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          cd site
          rm -f Alcode-Editor-*.exe Alcode-Editor-*.dmg Alcode-Editor-Windows.zip AlcodeEditor.zip.part*
          cp "$(find ../dist -name '*-x64-Setup.exe' | head -n1)" Alcode-Editor-Setup.exe
          cp "$(find ../dist -name '*-Portable.exe' | head -n1)" Alcode-Editor-Portable.exe
          cp "$(find ../dist -name '*-arm64.dmg' | head -n1)" Alcode-Editor-macOS-AppleSilicon.dmg
          cp "$(find ../dist -name '*-x64.dmg' | head -n1)" Alcode-Editor-macOS-Intel.dmg
          # Browsers that refuse an unsigned .exe usually accept a .zip of it,
          # and the same zip is split into 20 MB parts for connections that
          # drop mid-download.
          mkdir -p ../pack
          cp Alcode-Editor-Portable.exe "../pack/Alcode Editor Portable.exe"
          (cd ../pack && zip -q -j ../site/Alcode-Editor-Windows.zip "Alcode Editor Portable.exe")
          split -b 20971520 -d -a 1 Alcode-Editor-Windows.zip AlcodeEditor.zip.part
          # Byte-level sed: a Perl one-liner read the file as UTF-8 and its own
          # pattern as Latin-1, matched nothing, and left 1.6.0 on the page.
          sed -i -E "s/الإصدار [0-9.]+/الإصدار ${VERSION}/" index.html
          grep -q "الإصدار ${VERSION}" index.html || { echo "version not updated in index.html"; exit 1; }
          ls -la

      - name: Push as a single commit
        run: |
          cd site
          git checkout -q --orphan fresh
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Publish ${{ inputs.tag || github.ref_name }} on the download page"
          git push --force origin fresh:gh-pages

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name '*.yml' \) \
            -exec cp {} upload/ \;
          rm -f upload/builder-debug.yml
          ls -la upload

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Alcode Editor ${{ inputs.tag || github.ref_name }}
          files: upload/*
          draft: false
          generate_release_notes: true
          body: |
            ## Alcode Editor ${{ inputs.tag || github.ref_name }}

            **تحميل مباشر / Direct download**

            | النظام | الملف |
            | --- | --- |
            | Windows 10/11 (مثبّت) | `Alcode-Editor-1.14.0-x64-Setup.exe` |
            | Windows (محمول) | `Alcode-Editor-1.14.0-Portable.exe` |
            | macOS Apple Silicon | `Alcode-Editor-1.14.0-arm64.dmg` |
            | macOS Intel | `Alcode-Editor-1.14.0-x64.dmg` |

            ### الجديد في هذا الإصدار — التحرير في مكانه ومحرر يفهم Word

            **حرّر نص PDF بالنقر عليه مباشرة**

            - زر «تحرير النص في مكانه» في العارض يرسم إطارًا حول كل فقرة في
              الصفحة؛ انقر أي فقرة فتتحول إلى صندوق كتابة في موضعها وبحجمها
              واتجاهها، مع شريط صغير للحجم واللون. عند التطبيق يُحذف النص القديم
              من الملف ويُكتب الجديد مكانه نصًا حقيقيًا. لا حاجة لفتح أي نافذة.

            **العارض والمحرر في مكان واحد**

            - زر «فتح في المحرر» يحوّل نص المستند إلى مستند قابل للتحرير الكامل:
              يتعرّف على الفقرات والعناوين من أحجام الخطوط، وعلى المحاذاة من موضع
              الكتلة على الصفحة، وعلى الاتجاه من لغة النص، ويفصل الصفحات. ثم
              تحرّره كما في وورد وتحفظه Word أو PDF، وزر «العودة إلى العارض»
              يعيدك للملف الأصلي دون فقدان ما كتبت.

            **قراءة Word كما هي**

            - قارئ جديد لملفات ‎.docx يقرأ تنسيق Word نفسه بدل تبسيطه: الخط
              (بما فيه الخط العربي w:cs مثل Sakkal Majalla وTraditional Arabic)،
              والحجم بالنقاط، والغامق والمائل والتسطير، واللون والتظليل،
              والمحاذاة واتجاه الفقرة والمسافات البادئة والتباعد، والعناوين
              والقوائم والجداول والصور. المستند يعود إلى Word بالتنسيق نفسه.
            - قائمة الخطوط في المحرر صارت تعرض الخطوط العربية والإنجليزية
              المثبَّتة على الجهاز فعلًا، وتُظهر خط وحجم النص الذي يقف عنده المؤشر.

            **مُتحقَّق منه**

            - 146 فحصًا آليًا على كل دفعة، منها ذهاب وإياب كامل لملف Word
              (الخطوط والأحجام والمحاذاة تبقى)، وتحويل PDF إلى مستند
              (العناوين والفقرات والمحاذاة وفواصل الصفحات).

            **ملاحظات الإصدارات السابقة:** https://github.com/almarar88/liwapdf/releases/tag/v1.13.1

            > النسخ غير موقّعة رقمياً. على ويندوز اختر **More info → Run anyway**،
            > وعلى macOS افتح التطبيق بزر الفأرة الأيمن ثم **Open**.
