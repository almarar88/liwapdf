name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (created if it does not exist)'
        required: true
        default: 'v1.2.1'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            command: npm run dist:win
          - os: macos-latest
            label: macOS
            command: npm run dist:mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: ${{ matrix.command }}
        env:
          # Unsigned builds: skip signing and notarization entirely.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alcode-editor-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' \) \
            -exec cp {} upload/ \;
          ls -la upload

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Alcode Editor ${{ inputs.tag || github.ref_name }}
          files: upload/*
          draft: false
          generate_release_notes: true
          body: |
            ## Alcode Editor ${{ inputs.tag || github.ref_name }}

            **تحميل مباشر / Direct download**

            | النظام | الملف |
            | --- | --- |
            | Windows 10/11 (مثبّت) | `Alcode-Editor-1.2.4-x64-Setup.exe` |
            | Windows (محمول) | `Alcode-Editor-1.2.4-Portable.exe` |
            | macOS Apple Silicon | `Alcode-Editor-1.2.4-arm64.dmg` |
            | macOS Intel | `Alcode-Editor-1.2.4-x64.dmg` |

            ### الجديد في هذا الإصدار

            **الحروف العربية المنفصلة في المحرر**

            - ملفات Word — وكل ما يُحوَّل من PDF إلى Word — تحمل غالبًا **أشكال
              الحروف المرسومة** بدل الحروف نفسها: رمز مستقل لكل شكل. لا يستطيع
              أي مُشكِّل وصلها، فيظهر النص وكل حرف فيه منفصل عن جاره، ويفشل
              البحث والنسخ عليه أيضًا.
            - كان التطبيق يعالج هذا في ملفات ‎.txt‎ و‎.md‎ **فقط**. صار يعالجه في
              كل الصيغ: Word و RTF و ODT و EPUB و PowerPoint و HTML وجداول
              البيانات — في مكان واحد لا يمكن نسيانه مع أي صيغة تُضاف لاحقًا.
            - والمعالجة صارت لكل حرف على حدة، فلم تعد تمسّ الطباعة اللاتينية في
              المستند (روابط الحروف والكسور كانت تُعاد كتابتها بلا سبب).

            **خط عربي مناسب للمستندات**

            - سطح التحرير صار يفضّل خطوط النسخ المعتادة في الخطابات والتقارير
              (Sakkal Majalla ثم Segoe UI ثم Traditional وSimplified Arabic)،
              وأُضيفت كلها إلى قائمة الخطوط في شريط الأدوات. خط Amiri بقي في
              آخر القائمة لأنه خط نسخ فني لا يناسب متن المستندات.

            **الكتابة العربية داخل نماذج PDF**

            - تعبئة حقل في نموذج بنص عربي كانت **لا تفعل شيئًا**: خط الحقل
              الافتراضي في أي نموذج حكومي هو Helvetica، وترميزه لا يمثّل أي حرف
              عربي، فيُبتلع الخطأ ويقول التطبيق «تم» على نموذج لم يُملأ. صار
              يُضمَّن خط عربي عند الحاجة، والقيم العربية تُحاذى لليمين.
            - «مكتب Alcode بأبوظبي» كانت تُطبع «مكتب edoclA بأبوظبي» — الكلمة
              اللاتينية داخل الجملة العربية تنعكس. صارت صحيحة.

            **التعليقات والنصوص تنزل في مكانها الصحيح**

            - أي نص أو شكل تضيفه على صفحة **صندوق حدودها لا يبدأ من الصفر** —
              وهذا شائع في الملفات الممسوحة ضوئيًا والصادرة عن Word — كان ينزل
              مُزاحًا عن الموضع الذي رسمته. صار يستقر في مكانه بالضبط.
            - وعلى الصفحات **المُدارة** (90 و180 و270 درجة) كان ينزل مقلوبًا أو
              خارج الورقة. أُعيد اشتقاق التحويل من صفحات مرسومة فعليًا لا من
              حساب نظري، وصُحِّحت الزوايا الثلاث كلها — ويستفيد منها أيضًا
              العلامة المائية وترقيم الصفحات والترويسة.
            - النص العربي يبدأ من الحافة اليمنى للمربع الذي ترسمه، لا من اليسرى.

            **الأرقام العربية لم تعد تُقلب**

            - رقم مثل ١٢٣٤٥ كان يُكتب في ملف PDF معكوسًا (٥٤٣٢١) لأن مُشكّل الخطوط
              يعتبر الأرقام العربية‑الهندية نصًّا يُقرأ من اليمين. صار الرقم يظهر
              صحيحًا على الصفحة وعند نسخه أو البحث عنه — يمسّ أرقام الصفحات
              والتواريخ والمبالغ وطبقة الـOCR.

            **تنقيح بالبحث**

            - أداة جديدة تبحث عن نص أو نمط في كل الصفحات وتحذفه نهائيًا دفعة واحدة،
              مع أنماط جاهزة (بريد، هاتف، آيبان، هوية وطنية، بطاقة، تاريخ) وقائمة
              مراجعة تعرض كل تطابق بسياقه قبل الحذف.
            - التطبيق لم يعد يدّعي تحققًا لم يحدث: النتيجة تُفحَص فعليًا بعد الحفظ،
              ويمكن حفظ تقرير بما حُذف — لأن التنقيح لا رجعة فيه.

            **طباعة حقيقية**

            - زر الطباعة كان يفتح الملف في التطبيق نفسه بدل طباعته. صار يرسل الصفحات
              المطلوبة إلى نافذة الطباعة مع اختيار الطابعة والنطاق وعدد النسخ.

            **تصحيحات عربية أخرى**

            - استخراج النص يحترم اتجاه السطر، فلا تنقلب الجملة العربية.
            - «البحث عن كلمة كاملة» صار يعمل مع العربية (كان لا يطابق شيئًا).
            - الأرقام العربية‑الهندية داخل خلايا الجداول تُقرأ كأرقام.

            **من الإصدار السابق — إصلاحات تمسّ سلامة الملفات**

            - **ملف PDF محمي بكلمة مرور** كان تحريره يُنتج ملفًا لا يُفتح مرة أخرى؛ صار
              التشفير يُنظَّف فعليًا، ويُنبَّه المستخدم قبل الحفظ فوق أصل محمي.
            - **إعادة الترتيب والحذف والاستخراج والتكرار و«تحسين وإصلاح»** لم تعد تمحو
              الفهارس والنماذج والمرفقات وتسميات الصفحات.
            - **الملفات النصية** تُحفظ بترميزها الأصلي (Windows‑1256 يبقى كما هو)
              وبأسطرها كاملة — كان الحفظ يدمجها في سطر واحد.
            - **صفحات HTML** لم تعد تُحفظ فوق أصلها بقشرة ناقصة.
            - أخطاء الكتابة (نفاد المساحة، صلاحيات، قرص مفصول) تظهر برسالة واضحة بدل
              أن تمرّ بصمت، والدفعات تعزل كل ملف وتقول ما نجح وما فشل.

            **مميزات أساسية**

            - **التعرّف الضوئي على النص (OCR) — عربي وإنجليزي، بدون إنترنت.**
            - **تنقيح حقيقي** يحذف المحتوى ويتحقّق من اختفائه.
            - **تحديد النص ونسخه من صفحات PDF**، وبحث يُبرز التطابق في مكانه.
            - **نص عربي متجهي في PDF** قابل للبحث والتحديد.
            - **صفر اتصالات شبكية — مُتحقَّق منه**.
            - عارض مُحوسَب وبدء أسرع، وتشغيل كامل بلوحة المفاتيح.

            > النسخ غير موقّعة رقمياً. على ويندوز اختر **More info → Run anyway**،
            > وعلى macOS افتح التطبيق بزر الفأرة الأيمن ثم **Open**.
