name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (created if it does not exist)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            command: npm run dist:win
          - os: macos-latest
            label: macOS
            command: npm run dist:mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: ${{ matrix.command }}
        env:
          # Unsigned builds: skip signing and notarization entirely.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alcode-editor-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' \) \
            -exec cp {} upload/ \;
          ls -la upload

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Alcode Editor ${{ inputs.tag || github.ref_name }}
          files: upload/*
          draft: false
          generate_release_notes: true
          body: |
            ## Alcode Editor ${{ inputs.tag || github.ref_name }}

            **تحميل مباشر / Direct download**

            | النظام | الملف |
            | --- | --- |
            | Windows 10/11 (مثبّت) | `Alcode-Editor-1.2.0-x64-Setup.exe` |
            | Windows (محمول) | `Alcode-Editor-1.2.0-Portable.exe` |
            | macOS Apple Silicon | `Alcode-Editor-1.2.0-arm64.dmg` |
            | macOS Intel | `Alcode-Editor-1.2.0-x64.dmg` |

            ### الجديد في هذا الإصدار

            - **التعرّف الضوئي على النص (OCR) — عربي وإنجليزي، بدون إنترنت.** اقرأ النص من
              المستندات الممسوحة ضوئياً، أو أضف طبقة نص غير مرئية تجعل الملف قابلاً للبحث
              والتحديد والنسخ دون تغيير شكله. المحرك والنماذج كلها داخل التطبيق.
            - **تنقيح حقيقي.** التنقيح صار يحذف النص والصور من مجرى محتوى الصفحة ثم يتحقّق
              من اختفائها فعلاً — لا مجرد مربع أسود يُخفي نصاً يستخرجه أي قارئ.
            - **نص عربي متجهي في PDF.** العلامات المائية والترويسات وأرقام الصفحات صارت نصاً
              حقيقياً قابلاً للبحث والتحديد بدل صورة.
            - **صفر اتصالات شبكية — مُتحقَّق منه** بتسجيل كامل لطبقة الشبكة أثناء التشغيل.
            - **أسرع في البدء** (حزمة البدء من 6.8 إلى 1.1 ميغابايت) وعارض مُحوسَب افتراضياً
              يفتح مستندات المئات من الصفحات دون استنزاف الذاكرة.
            - **تشغيل كامل بلوحة المفاتيح** وتباين ألوان يحقّق مستوى AA.

            > النسخ غير موقّعة رقمياً. على ويندوز اختر **More info → Run anyway**،
            > وعلى macOS افتح التطبيق بزر الفأرة الأيمن ثم **Open**.
