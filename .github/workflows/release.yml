name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (created if it does not exist)'
        required: true
        default: 'v1.2.1'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            command: npm run dist:win
          - os: macos-latest
            label: macOS
            command: npm run dist:mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: ${{ matrix.command }}
        env:
          # Unsigned builds: skip signing and notarization entirely.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alcode-editor-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

  # The download page (github.io) mirrors the installers under names that do
  # not change between releases, so the README links never go stale. It is a
  # branch-served Pages site; the branch is rewritten as one commit each time,
  # otherwise every release would add another 400 MB to the repository.
  pages:
    name: Publish download page
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Stage installers under stable names
        run: |
          set -e
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          cd site
          rm -f Alcode-Editor-*.exe Alcode-Editor-*.dmg Alcode-Editor-Windows.zip AlcodeEditor.zip.part*
          cp "$(find ../dist -name '*-x64-Setup.exe' | head -n1)" Alcode-Editor-Setup.exe
          cp "$(find ../dist -name '*-Portable.exe' | head -n1)" Alcode-Editor-Portable.exe
          cp "$(find ../dist -name '*-arm64.dmg' | head -n1)" Alcode-Editor-macOS-AppleSilicon.dmg
          cp "$(find ../dist -name '*-x64.dmg' | head -n1)" Alcode-Editor-macOS-Intel.dmg
          # Browsers that refuse an unsigned .exe usually accept a .zip of it,
          # and the same zip is split into 20 MB parts for connections that
          # drop mid-download.
          mkdir -p ../pack
          cp Alcode-Editor-Portable.exe "../pack/Alcode Editor Portable.exe"
          (cd ../pack && zip -q -j ../site/Alcode-Editor-Windows.zip "Alcode Editor Portable.exe")
          split -b 20971520 -d -a 1 Alcode-Editor-Windows.zip AlcodeEditor.zip.part
          # Byte-level sed: a Perl one-liner read the file as UTF-8 and its own
          # pattern as Latin-1, matched nothing, and left 1.6.0 on the page.
          sed -i -E "s/الإصدار [0-9.]+/الإصدار ${VERSION}/" index.html
          grep -q "الإصدار ${VERSION}" index.html || { echo "version not updated in index.html"; exit 1; }
          ls -la

      - name: Push as a single commit
        run: |
          cd site
          git checkout -q --orphan fresh
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Publish ${{ inputs.tag || github.ref_name }} on the download page"
          git push --force origin fresh:gh-pages

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' \) \
            -exec cp {} upload/ \;
          ls -la upload

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Alcode Editor ${{ inputs.tag || github.ref_name }}
          files: upload/*
          draft: false
          generate_release_notes: true
          body: |
            ## Alcode Editor ${{ inputs.tag || github.ref_name }}

            **تحميل مباشر / Direct download**

            | النظام | الملف |
            | --- | --- |
            | Windows 10/11 (مثبّت) | `Alcode-Editor-1.9.0-x64-Setup.exe` |
            | Windows (محمول) | `Alcode-Editor-1.9.0-Portable.exe` |
            | macOS Apple Silicon | `Alcode-Editor-1.9.0-arm64.dmg` |
            | macOS Intel | `Alcode-Editor-1.9.0-x64.dmg` |

            ### الجديد في هذا الإصدار — سبع مميزات

            **معادلات في الجداول**

            - كانت الشبكة تقبل `=SUM(A1:A5)` ثم تعرض هذه الحروف كما هي. صار فيها
              محرّك معادلات حقيقي: الحساب والمراجع والنطاقات والمقارنات وربط النصوص،
              و SUM و AVERAGE و MIN و MAX و COUNT و COUNTA و IF و AND و OR و NOT
              و ROUND و ABS و SQRT و INT و MOD و POWER و LEN و CONCAT و UPPER
              و LOWER و TRIM و SUMIF و COUNTIF و TODAY. يقبل الفاصلة المنقوطة
              والفاصلة العربية والأرقام العربية، ويكشف الدوران (#CYCLE!) بدل التعليق.
            - تُحفظ المعادلة مع قيمتها في XLSX فيعيد Excel حسابها كما هي. الخلية تعرض
              النتيجة، ويظهر نص المعادلة عند تحريرها. تحقّقت منها ٢٤ فحصًا.

            **استئناف القراءة**

            - يتذكّر العارض آخر صفحة وصلت إليها في كل ملف، ويعود إليها عند فتحه
              مرة أخرى مع إشعار «استُئنفت القراءة من الصفحة ١٢».

            **لقطة من الصفحة**

            - زر كاميرا في شريط العارض: اسحب فوق أي جزء من الصفحة فيُنسخ كصورة PNG
              إلى الحافظة بدقة الشاشة — جاهز للّصق في Word أو رسالة.

            **قراءة بصوت**

            - في العارض (الصفحة الحالية) وفي محرر المستندات (التحديد أو المستند
              كله) بأصوات النظام المثبّتة — عربي أو إنجليزي حسب النص، دون إنترنت.
              إن لم يكن صوت مثبّتًا للّغة يقول لك ذلك بدل الصمت.

            **تثبيت الأدوات في الرئيسية**

            - نجمة على كل بطاقة في صندوق الأدوات؛ ما تثبّته يصير «إجراءاتك السريعة»
              في الصفحة الرئيسية بدل القائمة الافتراضية.

            **ورقة الاختصارات**

            - Ctrl + / تفتح كل اختصارات لوحة المفاتيح في نافذة، ومن لوحة الأوامر أيضًا.
              القائمة نفسها تغذّي صفحة الإعدادات فلا تختلفان.

            **تعرّف ضوئي دفعي**

            - المعالجة الدفعية صار فيها «تعرّف ضوئي»: مجلد كامل من المسح الضوئي
              يخرج بنص قابل للبحث والنسخ، ملفًا بعد ملف، وتُفرَّغ نماذج OCR عند
              الانتهاء.

            **ملاحظات الإصدارات السابقة:** https://github.com/almarar88/liwapdf/releases/tag/v1.8.0

            > النسخ غير موقّعة رقمياً. على ويندوز اختر **More info → Run anyway**،
            > وعلى macOS افتح التطبيق بزر الفأرة الأيمن ثم **Open**.
