name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (created if it does not exist)'
        required: true
        default: 'v1.2.1'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            command: npm run dist:win
          - os: macos-latest
            label: macOS
            command: npm run dist:mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: ${{ matrix.command }}
        env:
          # Signing is used the moment the secrets exist and skipped until
          # then: CSC_LINK is a base64 .p12 (Windows or Apple Developer ID),
          # the Apple trio enables notarization.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alcode-editor-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

  # The Android build is a different toolchain, not another matrix entry: the
  # same renderer is compiled for the web, wrapped by Capacitor and assembled
  # by Gradle. GitHub's Linux runner already carries the Android SDK.
  android:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      # The secrets context cannot be read from a step's `if`, so whether the
      # build is signed is decided once, here, and tested as a plain value.
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build the web layer and sync it into the Android project
        run: npm run mobile:sync

      - name: Prepare the signing key
        # Android refuses to install an unsigned APK — unlike Windows, there is
        # no "install anyway" for a package with no signature at all. So the
        # release is always signed: with the upload key when the repository
        # carries one, and otherwise with a key generated for this build.
        #
        # A generated key differs from release to release, which means an
        # update cannot install over the previous version until the app is
        # removed. Adding ANDROID_KEYSTORE (and its three companions) fixes
        # the signature in place and makes updates seamless.
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "Signing with the repository's upload key."
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/upload.jks" -alias alcode \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass alcode-build -keypass alcode-build \
              -dname "CN=Alcode Editor, O=Alcode, C=SA"
            echo "ANDROID_KEYSTORE_PASSWORD=alcode-build" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=alcode" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=alcode-build" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE secret: signing with a key generated for this build, so updating over an earlier install needs an uninstall first."
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Assemble the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK after the release, and refuse an unsigned one
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          case "$APK" in
            *unsigned*)
              echo "The build produced $APK — an unsigned APK cannot be installed."
              exit 1
              ;;
          esac
          # Prove it rather than trust the filename: an unsigned package must
          # never reach the download page again.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" "release/Alcode-Editor-${VERSION}.apk"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alcode-editor-Android
          path: release/*.apk
          if-no-files-found: error

  # The download page (github.io) mirrors the installers under names that do
  # not change between releases, so the README links never go stale. It is a
  # branch-served Pages site; the branch is rewritten as one commit each time,
  # otherwise every release would add another 400 MB to the repository.
  pages:
    name: Publish download page
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Stage installers under stable names
        run: |
          set -e
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          cd site
          rm -f Alcode-Editor-*.exe Alcode-Editor-*.dmg Alcode-Editor-*.apk Alcode-Editor-Windows.zip AlcodeEditor.zip.part*
          cp "$(find ../dist -name '*-x64-Setup.exe' | head -n1)" Alcode-Editor-Setup.exe
          cp "$(find ../dist -name '*-Portable.exe' | head -n1)" Alcode-Editor-Portable.exe
          cp "$(find ../dist -name '*-arm64.dmg' | head -n1)" Alcode-Editor-macOS-AppleSilicon.dmg
          cp "$(find ../dist -name '*-x64.dmg' | head -n1)" Alcode-Editor-macOS-Intel.dmg
          cp "$(find ../dist -name '*.apk' | head -n1)" Alcode-Editor-Android.apk
          # Browsers that refuse an unsigned .exe usually accept a .zip of it,
          # and the same zip is split into 20 MB parts for connections that
          # drop mid-download.
          mkdir -p ../pack
          cp Alcode-Editor-Portable.exe "../pack/Alcode Editor Portable.exe"
          (cd ../pack && zip -q -j ../site/Alcode-Editor-Windows.zip "Alcode Editor Portable.exe")
          split -b 20971520 -d -a 1 Alcode-Editor-Windows.zip AlcodeEditor.zip.part
          # Byte-level sed: a Perl one-liner read the file as UTF-8 and its own
          # pattern as Latin-1, matched nothing, and left 1.6.0 on the page.
          sed -i -E "s/الإصدار [0-9.]+/الإصدار ${VERSION}/" index.html
          grep -q "الإصدار ${VERSION}" index.html || { echo "version not updated in index.html"; exit 1; }
          ls -la

      - name: Push as a single commit
        run: |
          cd site
          git checkout -q --orphan fresh
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Publish ${{ inputs.tag || github.ref_name }} on the download page"
          git push --force origin fresh:gh-pages

  release:
    name: Publish release
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.apk' -o -name '*.blockmap' -o -name '*.yml' \) \
            -exec cp {} upload/ \;
          rm -f upload/builder-debug.yml
          ls -la upload

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Alcode Editor ${{ inputs.tag || github.ref_name }}
          files: upload/*
          draft: false
          generate_release_notes: true
          body: |
            ## Alcode Editor ${{ inputs.tag || github.ref_name }}

            **تحميل مباشر / Direct download**

            | النظام | الملف |
            | --- | --- |
            | Windows 10/11 (مثبّت) | `Alcode-Editor-1.17.0-x64-Setup.exe` |
            | Windows (محمول) | `Alcode-Editor-1.17.0-Portable.exe` |
            | macOS Apple Silicon | `Alcode-Editor-1.17.0-arm64.dmg` |
            | macOS Intel | `Alcode-Editor-1.17.0-x64.dmg` |

            ### الجديد في هذا الإصدار — تصميم تطبيق الهاتف من جديد

            **المستند صار يُقرأ**

            - كان شريط المصغّرات يفتح فوق المستند ويأخذ ٣٠٠ بكسل من شاشة
              عرضها ٤١٢، فتبقى الصفحة بحجم ٥٤٪ خلف الشريط. صار الشريط درجًا
              مغلقًا يُفتح عند الطلب فوق حجاب، والصفحة تملأ عرض الشاشة.
            - تكبير باللمس (إصبعان) ونقرتان للتكبير والعودة، والصفحة تُرسم من
              جديد عند كل تكبير فتبقى حادّة بدل أن تُمطّ.

            **القائمة صارت قائمة**

            - بدل سبعة تبويبات بأسماء طويلة تُمرَّر أفقيًا وثلاثة منها خارج
              الشاشة: خمسة مواضع ثابتة — الرئيسية، المستند، المسح الضوئي في
              الوسط، الأدوات، والمزيد — بكلمة واحدة لكل موضع، ولا شيء يُمرَّر
              ولا شيء خلف الحافة.
            - «المزيد» يفتح ورقة بصفوف مكتوبة: المحرر، تنظيم الصفحات، التحرير
              والتعليقات، التحويل، فتح ملف، الإعدادات.
            - شريط أدوات العارض صار ستة أزرار بحجم الإصبع، وبقية الخيارات —
              التكبير، الملاءمة، وضع القراءة، التدوير، تحرير النص، القراءة
              بصوت، الطباعة — في ورقة واحدة.
            - زر الرجوع في الهاتف يُغلق الورقة المفتوحة، ثم يعود إلى الرئيسية،
              ولا يخرج من التطبيق من منتصف مستند.

            تطبيق سطح المكتب لم يتغيّر: كل ما سبق داخل نسخة الهاتف وحدها.

            **ملاحظات الإصدارات السابقة:** https://github.com/almarar88/liwapdf/releases/tag/v1.16.1

            > النسخ غير موقّعة رقمياً. على ويندوز اختر **More info → Run anyway**،
            > وعلى macOS افتح التطبيق بزر الفأرة الأيمن ثم **Open**.
