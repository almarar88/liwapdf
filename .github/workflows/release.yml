name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (created if it does not exist)'
        required: true
        default: 'v1.2.1'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            command: npm run dist:win
          - os: macos-latest
            label: macOS
            command: npm run dist:mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: ${{ matrix.command }}
        env:
          # Unsigned builds: skip signing and notarization entirely.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alcode-editor-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

  # The download page (github.io) mirrors the installers under names that do
  # not change between releases, so the README links never go stale. It is a
  # branch-served Pages site; the branch is rewritten as one commit each time,
  # otherwise every release would add another 400 MB to the repository.
  pages:
    name: Publish download page
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Stage installers under stable names
        run: |
          set -e
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          cd site
          rm -f Alcode-Editor-*.exe Alcode-Editor-*.dmg Alcode-Editor-Windows.zip AlcodeEditor.zip.part*
          cp "$(find ../dist -name '*-x64-Setup.exe' | head -n1)" Alcode-Editor-Setup.exe
          cp "$(find ../dist -name '*-Portable.exe' | head -n1)" Alcode-Editor-Portable.exe
          cp "$(find ../dist -name '*-arm64.dmg' | head -n1)" Alcode-Editor-macOS-AppleSilicon.dmg
          cp "$(find ../dist -name '*-x64.dmg' | head -n1)" Alcode-Editor-macOS-Intel.dmg
          # Browsers that refuse an unsigned .exe usually accept a .zip of it,
          # and the same zip is split into 20 MB parts for connections that
          # drop mid-download.
          mkdir -p ../pack
          cp Alcode-Editor-Portable.exe "../pack/Alcode Editor Portable.exe"
          (cd ../pack && zip -q -j ../site/Alcode-Editor-Windows.zip "Alcode Editor Portable.exe")
          split -b 20971520 -d -a 1 Alcode-Editor-Windows.zip AlcodeEditor.zip.part
          # Byte-level sed: a Perl one-liner read the file as UTF-8 and its own
          # pattern as Latin-1, matched nothing, and left 1.6.0 on the page.
          sed -i -E "s/الإصدار [0-9.]+/الإصدار ${VERSION}/" index.html
          grep -q "الإصدار ${VERSION}" index.html || { echo "version not updated in index.html"; exit 1; }
          ls -la

      - name: Push as a single commit
        run: |
          cd site
          git checkout -q --orphan fresh
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Publish ${{ inputs.tag || github.ref_name }} on the download page"
          git push --force origin fresh:gh-pages

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' \) \
            -exec cp {} upload/ \;
          ls -la upload

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Alcode Editor ${{ inputs.tag || github.ref_name }}
          files: upload/*
          draft: false
          generate_release_notes: true
          body: |
            ## Alcode Editor ${{ inputs.tag || github.ref_name }}

            **تحميل مباشر / Direct download**

            | النظام | الملف |
            | --- | --- |
            | Windows 10/11 (مثبّت) | `Alcode-Editor-1.10.0-x64-Setup.exe` |
            | Windows (محمول) | `Alcode-Editor-1.10.0-Portable.exe` |
            | macOS Apple Silicon | `Alcode-Editor-1.10.0-arm64.dmg` |
            | macOS Intel | `Alcode-Editor-1.10.0-x64.dmg` |

            ### الجديد في هذا الإصدار — مميزات لا تجدها في غيره

            **تفقيط — المبلغ كتابةً**

            - زر في محرر المستندات يحوّل أي مبلغ إلى كلمات بقواعد العربية الصحيحة:
              «ريال واحد»، «ريالان»، «ثلاثة ريالات»، «أحد عشر ريالًا»، «مائة ريال»،
              و«ألف / ألفان / ثلاثة آلاف / أحد عشر ألفًا». يعرف عشر عملات (ريال
              سعودي، درهم، دينار كويتي ٣ أرقام للفلوس، قطري، بحريني، عماني، جنيه،
              أردني، دولار، يورو) وصيغة الشيك «فقط … لا غير»، وبالإنجليزية أيضًا.
            - في الجداول: `=TAFQEET(A1;"SAR";TRUE)` و `=SPELLNUMBER(A1;"USD")`
              للفواتير والعقود. ١٦ فحصًا على القواعد.

            **تنظيف النص العربي**

            - زر في المحرر: إزالة التشكيل والتطويل، توحيد الأرقام (عربية أو لاتينية)،
              ضبط المسافات حول علامات الترقيم (لا مسافة قبل الفاصلة، وفاصلة عربية
              بين الكلمات العربية)، وحذف المسافات المكرّرة — كل خيار على حدة، دون
              المساس بالتنسيق أو الصور، وتوحيد الهمزات خيار منفصل لأنه يغيّر الإملاء.

            **PDF إلى Excel — استخراج الجداول**

            - محوّل جديد يقرأ إحداثيات الكلمات في الصفحة، يجمعها في أسطر، يكتشف
              الأعمدة من محاذاة الخلايا، ويخرج ملف Excel بورقة لكل صفحة والأرقام
              أرقامًا. يفهم الجداول العربية (العمود الأول هو الأيمن). صفحة بلا جدول
              لا تُخترع لها ورقة.

            **كتيّب للطباعة**

            - أداة جديدة ترتّب الصفحات لطباعة كتيّب يُطوى من المنتصف ويُدبّس:
              صفحتان في كل وجه بالترتيب الصحيح (الأخيرة بجانب الأولى، ثم للداخل)،
              مع خيار التجليد على اليمين للكتب العربية. تحقّقت منها ٧ فحوص على
              ترتيب الصفحات في الاتجاهين.

            **عرض تقديمي بملء الشاشة**

            - زر في العارض يخفي كل شيء إلا الصفحة، بخلفية سوداء: الأسهم والمسافة
              للتنقل، وEsc للخروج — لعرض PDF كأنه شرائح.

            **ملاحظات الإصدارات السابقة:** https://github.com/almarar88/liwapdf/releases/tag/v1.9.0

            > النسخ غير موقّعة رقمياً. على ويندوز اختر **More info → Run anyway**،
            > وعلى macOS افتح التطبيق بزر الفأرة الأيمن ثم **Open**.
