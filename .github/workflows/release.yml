name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (created if it does not exist)'
        required: true
        default: 'v1.2.1'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            command: npm run dist:win
          - os: macos-latest
            label: macOS
            command: npm run dist:mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: ${{ matrix.command }}
        env:
          # Unsigned builds: skip signing and notarization entirely.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alcode-editor-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

  # The download page (github.io) mirrors the installers under names that do
  # not change between releases, so the README links never go stale. It is a
  # branch-served Pages site; the branch is rewritten as one commit each time,
  # otherwise every release would add another 400 MB to the repository.
  pages:
    name: Publish download page
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Stage installers under stable names
        run: |
          set -e
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          cd site
          rm -f Alcode-Editor-*.exe Alcode-Editor-*.dmg Alcode-Editor-Windows.zip AlcodeEditor.zip.part*
          cp "$(find ../dist -name '*-x64-Setup.exe' | head -n1)" Alcode-Editor-Setup.exe
          cp "$(find ../dist -name '*-Portable.exe' | head -n1)" Alcode-Editor-Portable.exe
          cp "$(find ../dist -name '*-arm64.dmg' | head -n1)" Alcode-Editor-macOS-AppleSilicon.dmg
          cp "$(find ../dist -name '*-x64.dmg' | head -n1)" Alcode-Editor-macOS-Intel.dmg
          # Browsers that refuse an unsigned .exe usually accept a .zip of it,
          # and the same zip is split into 20 MB parts for connections that
          # drop mid-download.
          mkdir -p ../pack
          cp Alcode-Editor-Portable.exe "../pack/Alcode Editor Portable.exe"
          (cd ../pack && zip -q -j ../site/Alcode-Editor-Windows.zip "Alcode Editor Portable.exe")
          split -b 20971520 -d -a 1 Alcode-Editor-Windows.zip AlcodeEditor.zip.part
          perl -CSD -pi -e "s/الإصدار [0-9.]+/الإصدار ${VERSION}/" index.html
          grep -o "الإصدار [0-9.]*" index.html
          ls -la

      - name: Push as a single commit
        run: |
          cd site
          git checkout -q --orphan fresh
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Publish ${{ inputs.tag || github.ref_name }} on the download page"
          git push --force origin fresh:gh-pages

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' \) \
            -exec cp {} upload/ \;
          ls -la upload

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Alcode Editor ${{ inputs.tag || github.ref_name }}
          files: upload/*
          draft: false
          generate_release_notes: true
          body: |
            ## Alcode Editor ${{ inputs.tag || github.ref_name }}

            **تحميل مباشر / Direct download**

            | النظام | الملف |
            | --- | --- |
            | Windows 10/11 (مثبّت) | `Alcode-Editor-1.7.0-x64-Setup.exe` |
            | Windows (محمول) | `Alcode-Editor-1.7.0-Portable.exe` |
            | macOS Apple Silicon | `Alcode-Editor-1.7.0-arm64.dmg` |
            | macOS Intel | `Alcode-Editor-1.7.0-x64.dmg` |

            ### الجديد في هذا الإصدار

            **مظهر جديد — أجمل وأكثر حياة**

            - **صفحة رئيسية جديدة** تبدأ ببطاقة ترحيب تتبع الساعة («صباح الخير» /
              «مساء الخير») وتعرض تاريخ اليوم **بالتقويمين الهجري والميلادي**، مع
              زرّي «فتح ملف» و«مستند جديد» ورسم لثلاث أوراق مروحية يأخذ لون التمييز.
            - **ألوان للأدوات:** كل عائلة أدوات لها لونها — الأزرق للصفحات، الأخضر
              لما يُصغّر الملف، الكهرماني للحماية، الوردي لما يحذف — فتُقرأ الشبكة
              بالعين قبل قراءة أسمائها. الأيقونة تتحرك قليلًا عند المرور.
            - **بطاقات الإحصاءات** صارت بأيقونات ملوّنة، ونافذة كل أداة تحمل
              أيقونتها في العنوان.
            - **اختيار السمة ببطاقات معاينة** (فاتح، داكن، تلقائي) بدل أزرار نصية،
              ولونا تمييز جديدان: **تركوازي** و**نيلي** — ثمانية ألوان الآن.
            - حبيبات ورقية خفيفة خلف الواجهة، وعلامة Alcode مرسومة بدل حرف نصي،
              وشارة في الشريط الجانبي تذكّر بأن التطبيق يعمل دون إنترنت وأن ملفاتك
              لا تغادر جهازك.

            **أفلت أي ملف في أي مكان**

            - لم يعد السحب والإفلات مقصورًا على المربّعين المنقّطين: أفلت ملفًا فوق
              أي شاشة في التطبيق، تظهر طبقة «أفلت هنا» ويُفتح الملف فورًا.

            **صندوق الأدوات: بحث وأدوات أخيرة**

            - **مربّع بحث** يرشّح الأدوات وأنت تكتب، بمطابقة عربية تتجاهل التشكيل
              وفرق الألف والهمزة. Esc يمسح البحث.
            - **«استخدمتها مؤخرًا»:** آخر الأدوات التي فتحتها تظهر كشرائح في
              الأعلى بنقرة واحدة.
            - كل مجموعة تعرض عدد أدواتها، والمسافات بين المجموعات صُحّحت.

            **الإجراءات السريعة تفتح الأداة نفسها**

            - كانت أزرار «دمج» و«تقسيم» و«ضغط» في الصفحة الرئيسية تنقلك إلى شبكة
              الأدوات لتبحث عن الأداة مرة أخرى. صارت تفتح نافذة الأداة مباشرة، مثل
              لوحة الأوامر. وأُضيفت OCR والتنقيح والمعالجة الدفعية إليها.

            **رموز في الترويسة والتذييل**

            - اكتب `{page}` و`{total}` و`{date}` و`{hijri}` في نص الترويسة أو
              التذييل وتُستبدل في كل صفحة برقم الصفحة وعدد الصفحات وتاريخ اليوم
              ميلاديًا وهجريًا. الأرقام تتبع لغة النص: «صفحة {page}» تعطي أرقامًا
              عربية، و«Page {page}» تعطي لاتينية. تحقّق منها ٧ فحوص على ملف
              مبني فعليًا.

            **صفحة التحميل**

            - كانت صفحة التحميل تخدم نسخة **1.2.4** رغم صدور خمسة إصدارات بعدها،
              لأن تحديثها كان يدويًا. حُدِّثت إلى الإصدار الأخير، وصار سير عمل
              الإصدار **ينشرها تلقائيًا** مع كل نسخة جديدة تحت الأسماء الثابتة
              نفسها، فلا تتقادم مرة أخرى. وأُزيل سير عمل Pages القديم الذي كان
              يفشل عند كل تشغيل.

            **إصلاحات أخرى**

            - كان زر لوحة الأوامر في شريط العنوان يظهر بحلقة تركيز زرقاء عند كل
              تشغيل دون أن يلمسه أحد؛ لم يعد.
            - محوّلات التقويم انتقلت خارج حزمة PDF، فالصفحة الرئيسية تعرض التاريخ
              دون تحميل مكتبات الـPDF عند البدء.

            **ملاحظات الإصدارات السابقة:** https://github.com/almarar88/liwapdf/releases/tag/v1.6.0

            > النسخ غير موقّعة رقمياً. على ويندوز اختر **More info → Run anyway**،
            > وعلى macOS افتح التطبيق بزر الفأرة الأيمن ثم **Open**.
