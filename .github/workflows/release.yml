name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            command: npm run dist:win
          - os: macos-latest
            label: macOS
            command: npm run dist:mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: ${{ matrix.command }}
        env:
          # Unsigned builds: skip notarization/signing entirely.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alcode-editor-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: warn

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name 'latest*.yml' \) -exec cp {} upload/ \;
          ls -la upload

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          draft: false
          generate_release_notes: true
          name: Alcode Editor ${{ github.ref_name }}
          body: |
            ## Alcode Editor ${{ github.ref_name }}

            **تحميل مباشر / Direct download**

            | النظام | الملف |
            | --- | --- |
            | Windows 10/11 (installer) | `Alcode-Editor-*-x64-Setup.exe` |
            | Windows (portable) | `Alcode-Editor-*-Portable.exe` |
            | macOS Apple Silicon | `Alcode-Editor-*-arm64.dmg` |
            | macOS Intel | `Alcode-Editor-*-x64.dmg` |

            > النسخ غير موقّعة رقمياً. على ويندوز اختر **More info → Run anyway**، وعلى macOS افتح التطبيق بزر الفأرة الأيمن ثم **Open**.
