name: Tests

# Every push runs the type check, the production build, and the renderer test
# suites inside a real Electron window under a virtual display — the same
# engines, fonts and canvas the shipped app uses.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npx electron-vite build
      - name: Build tests
        run: npm run test:build
      - name: Run tests in Electron
        run: xvfb-run -a npm run test:run
