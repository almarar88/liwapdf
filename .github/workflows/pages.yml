name: Publish download page

# Release assets are served from objects.githubusercontent.com, which some
# networks block while github.com itself resolves normally — the download then
# fails with a connection error rather than a 404. Pages serves from github.io,
# so the same installers are published there as a second route.

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Turning Pages on is what creates the github-pages environment, so it cannot
  # happen inside the job that declares it — that job would be gated on an
  # environment which does not exist yet and fail before its first step.
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true

  deploy:
    needs: enable
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
