name: Publish download page

# Release assets are served from objects.githubusercontent.com, which some
# networks block while github.com itself resolves normally — the download then
# fails with a connection error rather than a 404. Pages serves from github.io,
# so the same installers are published there as a second route.

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository, so publishing needs no visit to
          # the settings screen.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
